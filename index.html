<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Messages</title><style>
:root{--bg:#f2f4ef;--ink:#13303a;--mut:#5d717a;--acc:#1d6b5c;--hi:#ffd23f;--card:#fff;--line:#d5ddd8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1e;--ink:#e6efec;--mut:#93a8a8;--acc:#3fa58f;--card:#18262b;--line:#2a3c42}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column;max-width:960px;margin:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6em 1em;cursor:pointer}button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%}label{display:block;margin:.7em 0;font-size:.9em;color:var(--mut)}label input,label select,label textarea{margin-top:.25em;color:var(--ink)}
:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
header{display:flex;align-items:center;gap:.6em;padding:.6em .8em;border-bottom:1px solid var(--line);flex-wrap:wrap}header h1{font-size:1.3em;margin:0;flex:1}nav{display:flex;gap:.3em}nav button{background:none;color:var(--ink)}nav button.on{background:var(--hi);color:#13303a;font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}.lg{margin:auto;width:min(380px,92%)}.lg form{background:var(--card);padding:1.4em;border-radius:16px;border:1px solid var(--line)}.lg h1{margin:0 0 .4em}.lg button{width:100%;margin-top:.5em}.er{color:#c0392b;min-height:1.2em;margin:.4em 0}
.list{flex:1;overflow:auto;padding:.8em;display:flex;flex-direction:column;gap:.5em}.m{max-width:min(80%,520px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.4em .7em;align-self:flex-start;word-break:break-word}.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-color:var(--acc)}.m.bare{background:none;border:0}.m b{display:block;font-size:.75em;opacity:.8}.m i{display:block;font-size:.7em;opacity:.7;text-align:right}.m img.image{max-width:100%;max-height:260px;border-radius:10px;cursor:zoom-in;display:block}.m img.sticker{width:140px;height:140px}.m audio{max-width:100%}.m a{color:inherit}
.cmp{display:flex;gap:.4em;padding:.6em;border-top:1px solid var(--line);align-items:center}.cmp input{flex:1;min-width:0}.ib{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:.5em .65em;cursor:pointer;border-radius:10px}.ib.rec{background:#c0392b;color:#fff}
.stk{padding:.6em;border-top:1px solid var(--line);max-height:42%;overflow:auto}.sg{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}.sg img{width:72px;height:72px;cursor:pointer}.mk{display:grid;gap:.5em;justify-items:start}.mk canvas{width:160px;height:160px;border:1px dashed var(--line);border-radius:12px}
#lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#lb[hidden]{display:none}#lb img{max-width:96vw;max-height:96vh}
.ev,.evl{padding:1em;width:100%}.bar{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-bottom:.6em}.bar h2{flex:1;margin:0}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7em;padding:0 1em 1em}.card{background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:left;display:grid;gap:.2em;padding:1em}.card span{color:var(--acc);font-weight:600}.card small,.mut{color:var(--mut)}
fieldset{border:1px solid var(--line);border-radius:12px;margin:.7em 0}legend{font-weight:600}.op{display:flex;gap:.5em;align-items:center;color:var(--ink);font-size:1em}.op input{width:auto}
.tiles{display:flex;gap:.3em;flex-wrap:wrap;margin:.4em 0}.tiles span{background:var(--hi);color:#13303a;font-weight:800;min-width:2em;text-align:center;border-radius:8px;padding:.3em}
.res{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hi);padding:.6em .8em;border-radius:8px}.row{display:flex;gap:.5em}.big{font-size:2em;width:100%;padding:1.2em;margin:.5em 0;touch-action:manipulation;user-select:none}
ol.lbd{padding-left:1.4em}ol.lbd li{padding:.2em 0}
</style></head><body><div id=app></div><div id=lb hidden onclick="this.hidden=true"></div><script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={questionnaire:'Questionnaire',guess:'Number Guess',scramble:'Word Scramble',riddle:'Riddle Race',tap:'Tap Rush',math:'Math Sprint'};
let tab='messages',after=0,me=null;const app=$('#app'),lb=$('#lb');
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.m||'GET',headers:{'content-type':'application/json'},body:o.b?JSON.stringify(o.b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&p!=='login'&&me){me=null;login()}throw new Error(j.error||'Something went wrong')}return j}
async function sendBlob(b,name,type){const r=await fetch('/api/upload',{method:'POST',headers:{'x-name':encodeURIComponent(name),'content-type':type||'application/octet-stream'},body:b});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
function login(){app.innerHTML=`<div class=lg style="margin:auto"><form id=lf><h1>Messages</h1><label>Last Name<input name=last autocomplete=off required></label><label>Name Identification<input name=id type=password autocomplete=off inputmode=numeric></label><p id=er class=er></p><button>Log in</button></form></div>`;
$('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{me=(await api('login',{m:'POST',b:{last:f.get('last'),id:f.get('id')}})).user;shell()}catch(x){$('#er').textContent=x.message}}}
function shell(){app.innerHTML=`<header><h1>Messages</h1><nav><button data-t=messages>Messages</button><button data-t=events>Events</button></nav><button id=lo class=ghost>Log out (${esc(me)})</button></header><main id=main></main>`;
app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));$('#lo').onclick=async()=>{await api('logout',{m:'POST'}).catch(()=>{});me=null;login()};go(tab)}
function go(t){tab=t;app.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));t==='messages'?msgs():evs()}
const mh=m=>{const b=m.kind==='image'||m.kind==='sticker'?`<img class="${m.kind}" src="${m.url}" ${m.kind==='image'?'data-full=1':''} alt="">`:m.kind==='audio'?`<audio controls preload=none src="${m.url}"></audio>`:m.kind==='file'?`<a href="${m.url}" download>📄 ${esc(m.name)}</a>`:`<span>${esc(m.text)}</span>`;
return `<div class="m${m.user===me?' me':''}${m.kind==='sticker'?' bare':''}"><b>${esc(m.user)}</b>${b}<i>${new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</i></div>`};
const post=b=>api('messages',{m:'POST',b}).then(poll).catch(x=>alert(x.message));
function msgs(){after=0;$('#main').innerHTML=`<div id=list class=list></div><div id=stk class=stk hidden></div><form id=cmp class=cmp><label class=ib style="margin:0" title="Attach a file or image">📎<input id=fi type=file hidden></label><button type=button class=ib id=st title=Stickers>😀</button><button type=button class=ib id=mic title="Record audio">🎤</button><input id=tx placeholder="Write a message" autocomplete=off><button>Send</button></form>`;
$('#list').onclick=e=>{const i=e.target.closest('[data-full]');if(i){lb.innerHTML=`<img src="${i.src}" alt="">`;lb.hidden=false}};
$('#cmp').onsubmit=e=>{e.preventDefault();const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';post({kind:'text',text:t})};
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=await sendBlob(f,f.name,f.type);post({kind:f.type.startsWith('image/')?'image':f.type.startsWith('audio/')?'audio':'file',url:j.url,name:j.name})}catch(x){alert(x.message)}};
let rec;$('#mic').onclick=async()=>{const b=$('#mic');if(rec){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());b.classList.remove('rec');const ty=(rec.mimeType||'audio/webm').split(';')[0];rec=null;try{const j=await sendBlob(new Blob(ch,{type:ty}),'voice.'+(ty.includes('mp4')?'m4a':'webm'),ty);post({kind:'audio',url:j.url,name:j.name})}catch(x){alert(x.message)}};rec.start();b.classList.add('rec')}catch{alert('Microphone is not available.')}};
$('#st').onclick=async()=>{const p=$('#stk');if(!p.hidden){p.hidden=true;return}p.hidden=false;const l=await api('stickers');p.innerHTML=`<div class=sg>${l.map(s=>`<img src="${s.url}" data-s="${s.url}" alt=sticker>`).join('')}<button type=button id=ns>+ New sticker</button></div>`;p.onclick=e=>{const u=e.target.dataset.s;if(u){p.hidden=true;post({kind:'sticker',url:u})}if(e.target.id==='ns')maker()}};poll()}
function maker(){const p=$('#stk');p.innerHTML=`<div class=mk><canvas id=cv width=256 height=256></canvas><input id=mt placeholder="Emoji or short text" maxlength=12 value="😎"><label>Background <input id=mb type=color value="#ffd23f"></label><label>Text <input id=mf type=color value="#13303a"></label><button type=button id=ms>Save and send</button></div>`;
const c=$('#cv'),x=c.getContext('2d'),d=()=>{x.clearRect(0,0,256,256);x.fillStyle=$('#mb').value;x.beginPath();x.roundRect(8,8,240,240,48);x.fill();const t=$('#mt').value||' ',n=[...t].length;x.fillStyle=$('#mf').value;x.textAlign='center';x.textBaseline='middle';x.font=`bold ${Math.min(150,Math.floor(220/Math.max(1,n*.7)))}px system-ui,sans-serif`;x.fillText(t,128,136)};
p.oninput=d;d();$('#ms').onclick=()=>c.toBlob(async b=>{try{const j=await sendBlob(b,'sticker.png','image/png');await api('stickers',{m:'POST',b:{url:j.url}});p.hidden=true;post({kind:'sticker',url:j.url})}catch(e){alert(e.message)}},'image/png')}
async function poll(){if(tab!=='messages'||!me)return;const L=$('#list');if(!L)return;try{const j=await api('messages?after='+after);if(!j.length)return;const nb=after===0||L.scrollHeight-L.scrollTop-L.clientHeight<90;L.insertAdjacentHTML('beforeend',j.map(mh).join(''));after=j.at(-1).id;if(nb)L.scrollTop=L.scrollHeight}catch{}}
setInterval(poll,2500);
async function evs(){const m=$('#main');m.innerHTML=`<div class=evl><div class=bar><h2>Events</h2><select id=nt aria-label="Event type">${Object.entries(TYPES).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select><button id=nn>New event</button></div></div><div id=el class=grid></div>`;
$('#nn').onclick=()=>editor(null,$('#nt').value);const l=await api('events');$('#el').innerHTML=l.length?l.map(e=>`<button class=card data-id=${e.id}><b>${esc(e.title)}</b><span>${TYPES[e.type]}</span><small>${e.count} joined · by ${esc(e.creator)}</small></button>`).join(''):'<p class=mut>No events yet. Pick a type and create the first one.</p>';
$('#el').onclick=e=>{const c=e.target.closest('[data-id]');if(c)openEv(c.dataset.id)}}
async function openEv(id){let e;try{e=await api('events/'+id)}catch(x){return alert(x.message)}tab='events';app.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==='events'));
$('#main').innerHTML=`<div class=ev><div class=bar><button class=ghost id=bk>← Events</button><button class=ghost id=ed>Edit</button></div><h2>${esc(e.title)}</h2><p class=mut>${TYPES[e.type]} · by ${esc(e.creator)} · ${e.count} joined</p>${e.desc?`<p>${esc(e.desc)}</p>`:''}<div id=pl></div><h3>Leaderboard</h3><ol class=lbd>${e.board.map(r=>`<li><b>${esc(r.user)}</b> ${esc(r.label)}</li>`).join('')||'<li class=mut>No results yet</li>'}</ol></div>`;
$('#bk').onclick=evs;$('#ed').onclick=async()=>editor(await api(`events/${id}/full`),e.type);const pl=$('#pl');
if(!e.joined){pl.innerHTML='<button id=jn>Join to participate</button>';$('#jn').onclick=async()=>{await api(`events/${id}/join`,{m:'POST'});openEv(id)};return}
({questionnaire:pItems,scramble:pItems,riddle:pItems,guess:pGuess,tap:pTap,math:pMath})[e.type](pl,e,id)}
function pItems(pl,e,id){const lock=e.type==='questionnaire'&&e.mine;pl.innerHTML=(e.mine?`<p class=res>Your score: ${esc(e.mine.label)}${lock?'':' (best). You can try again.'}</p>`:'')+(lock?'':`<form id=qf>${e.config.items.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q.q)} <small>${q.points} pt</small></legend>${q.shown?`<div class=tiles>${[...q.shown].map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}${q.type==='mc'?q.options.map((o,j)=>`<label class=op><input type=radio name=a${i} value=${j}> ${esc(o)}</label>`).join(''):q.type==='tf'?['true','false'].map(v=>`<label class=op><input type=radio name=a${i} value=${v}> ${v==='true'?'True':'False'}</label>`).join(''):`<input name=a${i} autocomplete=off placeholder="Your answer">`}</fieldset>`).join('')}<button>Submit answers</button><p id=er class=er></p></form>`);
if(!lock)$('#qf').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await api(`events/${id}/submit`,{m:'POST',b:{answers:e.config.items.map((_,i)=>f.get('a'+i)??'')}});openEv(id)}catch(x){$('#er').textContent=x.message}}}
function pGuess(pl,e,id){const c=e.config;if(e.mine){pl.innerHTML=`<p class=res>You found it in ${e.mine.label}.</p>`;return}
pl.innerHTML=`<p>Guess the secret number from ${c.min} to ${c.max}. Fewer tries rank higher.</p><form id=gf class=row><input type=number name=n min=${c.min} max=${c.max} required><button>Guess</button></form><p id=gh class=res>Make your first guess.</p>`;
$('#gf').onsubmit=async ev=>{ev.preventDefault();const n=+new FormData(ev.target).get('n');try{const r=await api(`events/${id}/guess`,{m:'POST',b:{n}});if(r.hint==='correct')return openEv(id);$('#gh').textContent=`${n} is too ${r.hint==='higher'?'low. Go higher.':'high. Go lower.'} Tries: ${r.tries}`;ev.target.reset()}catch(x){$('#gh').textContent=x.message}}}
function pTap(pl,e,id){const s=e.config.seconds;pl.innerHTML=`<p>Tap as many times as you can in ${s} seconds. Your best score counts${e.mine?` (best: ${e.mine.label})`:''}.</p><button id=tb class=big>Tap to start</button><p id=ts class=res>Ready</p>`;let n=0,t0=0,on=false;const b=$('#tb');
b.onpointerdown=ev=>{ev.preventDefault();if(on&&Date.now()-t0>=s*1000)return;if(!on){on=true;n=0;t0=Date.now();const iv=setInterval(async()=>{const left=s-(Date.now()-t0)/1000;$('#ts').textContent=left>0?left.toFixed(1)+'s left':'Time is up';if(left<=0){clearInterval(iv);b.disabled=true;try{await api(`events/${id}/submit`,{m:'POST',b:{score:n}})}catch{}setTimeout(()=>openEv(id),800)}},100)}n++;b.textContent=n}}
function pMath(pl,e,id){const s=e.config.seconds,M=e.config.max;pl.innerHTML=`<p>Solve as many as you can in ${s} seconds. One point each. Best score counts${e.mine?` (best: ${e.mine.label})`:''}.</p><button id=ms2>Start</button><div id=mg hidden><div class=big id=mq></div><form id=mf2 class=row><input id=ma type=number inputmode=numeric required><button>OK</button></form><p id=mt2 class=res></p></div>`;
$('#ms2').onclick=()=>{$('#ms2').hidden=true;$('#mg').hidden=false;let sc=0,a;const t0=Date.now(),R=()=>Math.floor(Math.random()*M)+1;
const nq=()=>{const x=R(),y=R(),o=['+','-','×'][Math.floor(Math.random()*3)];a=o==='+'?x+y:o==='-'?x-y:x*y;$('#mq').textContent=`${x} ${o} ${y}`;$('#ma').value='';$('#ma').focus()};nq();
const iv=setInterval(async()=>{const left=s-(Date.now()-t0)/1000;$('#mt2').textContent=`${Math.max(0,left).toFixed(0)}s left · score ${sc}`;if(left<=0){clearInterval(iv);try{await api(`events/${id}/submit`,{m:'POST',b:{score:sc}})}catch{}openEv(id)}},200);
$('#mf2').onsubmit=ev=>{ev.preventDefault();if(+$('#ma').value===a)sc++;nq()}}}
const DEF={questionnaire:{items:[]},scramble:{items:[]},riddle:{items:[]},guess:{min:1,max:100,secret:50},tap:{seconds:10},math:{seconds:30,max:12}};
function editor(e,type){const S=e?{id:e.id,title:e.title,desc:e.desc||'',config:e.config}:{title:'',desc:'',config:structuredClone(DEF[type])},m=$('#main'),isI=!!S.config.items;
const num=(l,k,mn)=>`<label>${l}<input type=number data-n data-k=config.${k} min=${mn??0} value=${S.config[k]}></label>`;
const itemsEd=()=>S.config.items.map((q,i)=>`<fieldset><legend>Item ${i+1} <button type=button class=ghost data-rm=${i}>Remove item</button></legend>${type==='questionnaire'?`<label>Type<select data-k=config.items.${i}.type data-redraw>${[['mc','Multiple choice'],['id','Identification'],['tf','True or false']].map(([v,l])=>`<option value=${v}${q.type===v?' selected':''}>${l}</option>`).join('')}</select></label>`:''}<label>${type==='scramble'?'Hint (optional)':type==='riddle'?'Riddle':'Question'}<textarea data-k=config.items.${i}.q rows=2>${esc(q.q)}</textarea></label>${q.type==='mc'?`<label>Options (one per line)<textarea data-k=config.items.${i}.options data-lines rows=4>${esc((q.options||[]).join('\n'))}</textarea></label><label>Correct option number<input type=number min=1 data-n data-off=-1 data-k=config.items.${i}.answer value=${(+q.answer||0)+1}></label>`:q.type==='tf'?`<label>Correct answer<select data-k=config.items.${i}.answer>${['true','false'].map(v=>`<option value=${v}${String(q.answer)===v?' selected':''}>${v==='true'?'True':'False'}</option>`).join('')}</select></label>`:`<label>${type==='scramble'?'Word':'Answer'} (separate accepted answers with |)<input data-k=config.items.${i}.answer value="${esc(q.answer)}"></label>`}<label>Points<input type=number min=0 data-n data-k=config.items.${i}.points value=${q.points}></label></fieldset>`).join('')+`<button type=button class=ghost id=ai>+ Add item</button>`;
const other=()=>type==='guess'?num('Lowest number','min',-1e6)+num('Highest number','max',-1e6)+num('Secret number','secret',-1e6):num('Seconds','seconds',5)+(type==='math'?num('Biggest number in problems','max',5):'');
const draw=()=>{m.innerHTML=`<div class=ev><div class=bar><button class=ghost id=cx>← Cancel</button></div><h2>${e?'Edit':'New'} ${TYPES[type]}</h2><label>Title<input data-k=title value="${esc(S.title)}"></label><label>Description<textarea data-k=desc rows=2>${esc(S.desc)}</textarea></label>${isI?itemsEd():other()}<p id=er class=er></p><button id=sv>Save event</button></div>`};
m.oninput=m.onchange=ev=>{const t=ev.target,k=t.dataset.k;if(!k)return;let v=t.value;if('lines' in t.dataset)v=v.split('\n');else if('n' in t.dataset)v=(+v)+(+t.dataset.off||0);const p=k.split('.');let o=S;p.slice(0,-1).forEach(x=>o=o[x]);o[p.at(-1)]=v;
if('redraw' in t.dataset&&ev.type==='change'){const it=o;it.answer=v==='mc'?0:v==='tf'?'true':'';it.options=v==='mc'?(it.options?.length>1?it.options:['','']):it.options;draw()}};
m.onclick=async ev=>{const t=ev.target;if(t.id==='cx')return e?openEv(S.id):evs();if(t.id==='ai'){S.config.items.push(type==='questionnaire'?{type:'mc',q:'',options:['',''],answer:0,points:1}:{type:'id',q:'',answer:'',points:1});return draw()}
if(t.dataset.rm!==undefined){S.config.items.splice(+t.dataset.rm,1);return draw()}
if(t.id==='sv'){try{const b={title:S.title,desc:S.desc,config:S.config},r=e?await api('events/'+S.id,{m:'PUT',b}):await api('events',{m:'POST',b:{...b,type}});openEv(r.id)}catch(x){$('#er').textContent=x.message}}};
if(isI&&!e)S.config.items.push(type==='questionnaire'?{type:'mc',q:'',options:['',''],answer:0,points:1}:{type:'id',q:'',answer:'',points:1});draw()}
api('me').then(j=>{me=j.user;shell()}).catch(login);
</script></body></html>
